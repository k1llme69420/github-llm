jobs:
  chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Code
        uses: actions/checkout@v4

      - name: Checkout Model Weights
        uses: actions/checkout@v4
        with:
          ref: model-weights
          path: weights

      - name: Checkout Chat History
        uses: actions/checkout@v4
        with:
          ref: chat-history
          path: memory

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-llama-cpp

      - name: Cache Model GGUF
        id: cache-model
        uses: actions/cache@v4
        with:
          path: model.gguf
          key: model-gguf-${{ hashFiles('weights/model_part_*') }}

      - name: Reassemble Model Weights (If Cache Misses)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss! Stitching chunks together..."
          cat weights/model_part_* > model.gguf

      - name: Run Inference & Update Memory
        env:
          USER_PROMPT: ${{ github.event.inputs.prompt }}
          CLEAR_HISTORY: ${{ github.event.inputs.clear_history }}
        run: |
          sed -i 's/\r$//' run.sh
          bash run.sh